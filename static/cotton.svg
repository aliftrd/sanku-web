<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="cotton-texture" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" result="cloud"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" result="grain"/>
    <feBlend mode="multiply" in="cloud" in2="grain" result="blend"/>
    <feColorMatrix type="matrix" values="0.8 0 0 0 0.18  0 0.8 0 0 0.17  0 0 0.78 0 0.16  0 0 0 0.04 0"/>
  </filter>
  <rect width="360" height="360" fill="transparent" filter="url(#cotton-texture)"/>
</svg>